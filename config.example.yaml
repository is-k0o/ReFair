project:
  id: 11111111-1111-4111-8111-111111111111
  name: example

actors:
  actor_a:
    firefox_profile: example-ai-a
    listener: 8082

  actor_b:
    firefox_profile: example-ai-b
    listener: 8083

bridge:
  bind_address: 127.0.0.1
  port: 8765
  sqlite_path: ./refair.sqlite3

execution:
  max_concurrent_active_requests: 1
  requests_per_second: 1
  burst: 1

budgets:
  http:
    max_requests: 250
    max_mutations: 50
    max_per_endpoint: 12
    max_identical_replays: 3

  api:
    max_cost_usd: 2.00
    max_model_calls: 100
    max_input_tokens: 2000000
    max_output_tokens: 250000
    warning_thresholds:
      - 0.50
      - 0.80
      - 0.95
