[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "refair"
version = "0.1.5"
description = "Deterministic foundations for authorized AI-assisted web security research."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
]

[project.scripts]
refair-collector = "refair.bridge.__main__:main"
refair-inspect = "refair.inspect.cli:main"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["refair"]
